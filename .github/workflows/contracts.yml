name: API contract

on: [push, pull_request]

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r api/requirements-contract.txt
      - run: python -m pytest api/tests
      - run: python api/scripts/build_contract_fixtures.py
      - run: python api/scripts/export_openapi.py --check
      - run: npm ci --prefix web
      - run: npm run contract:types --prefix web -- --check
      - run: git diff --exit-code -- contracts/ web/src/fixtures/generated/
      - run: npm run build --prefix web
      - run: node web/scripts/check-demo.mjs
